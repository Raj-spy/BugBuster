name: BugBuster

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bugbuster:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install BugBuster
        run: pip install -e .

      - name: Run BugBuster on this diff
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          python cli.py run --diff <(git diff origin/main...HEAD)
