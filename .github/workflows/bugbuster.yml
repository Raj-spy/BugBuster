name: BugBuster

on:
  push:
    branches:
      - '**'
      - '!bugbuster/**'
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  bugbuster:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git for automated bot commits
        run: |
          git config --global user.name "BugBuster Bot"
          git config --global user.email "bot@bugbuster.local"

      - name: Install BugBuster
        run: pip install -e .

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -C /usr/local/bin -xz gitleaks
          gitleaks version

      - name: Run BugBuster on this diff
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_PAT: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > bugbuster-input.diff
          else
            git diff HEAD~1 HEAD > bugbuster-input.diff
          fi
          python cli.py run --diff bugbuster-input.diff --target . --output bugbuster-report.md || true

      - name: Publish Proof Report to Actions Summary
        if: always()
        run: |
          if [ -f bugbuster-report.md ]; then
            cat bugbuster-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload BugBuster report
        uses: actions/upload-artifact@v4
        with:
          name: bugbuster-report
          path: bugbuster-report.*
